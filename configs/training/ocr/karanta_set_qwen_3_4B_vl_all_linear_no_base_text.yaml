dataloader_num_workers: 4
max_length: 8192
data_cache_folder_name: processed_no_anchor_all_samples_8192

# Experiment Configuration
exp_name: karanta_set_qwen_3_4B_vl_all_samples_linear_no_base_text_bf16
seed: 42
report_to:
  - wandb
gradient_accumulation_steps: 8
use_flash_attention: True
output_dir: /home/ubuntu/karanta-ocr
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
hf_entity: taresco
reduce_loss: sum
wandb_project_name: karanta
wandb_entity: african-research-collective
logging_steps: 100
eval_steps: 1000
checkpointing_steps: 1000
use_deepspeed: true
num_train_epochs: 1
optimizer: adamw_torch
lr_scheduler_type: cosine
num_samples: -1
is_profile: false
learning_rate: 1e-6