# Model Configuration
model_name_or_path: &model_name "Qwen/Qwen3-VL-4B-Instruct"
model_revision: main

# Dataset configuration
dataset_train:
  - name: karanta_olmomix
    root_dir: /home/ubuntu/train_images_karanta/olmo_mix
    pdf_dir_name: pdf
    json_dir_name: json_output
    pipeline:
      - name: PDF2ImageStep
        target_longest_image_dim: 1024
      - name: FetchMultipageData
      - name: FinetuningPrompt
        prompt_path: configs/prompts/open_ai_data_generation.yaml
      - name: JSONOutputFormat
      - name: InstructUserMessages
        prompt_first: true
      - name: Tokenizer
        processor: *model_name
        max_length: 8192
  - name: karanta_dictionary
    root_dir: /home/ubuntu/train_images_karanta/dictionary
    pdf_dir_name: pdf
